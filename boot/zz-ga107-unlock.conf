# Load only on kernels with an installed matching module. Do not put a trailing
# '?' in systemd's MODULES.conf: it is a build-time mkinitcpio marker only.
# systemd can load modules concurrently, so the custom initrd-only service
# explicitly completes this module before modules-load and udev start.
[[ ${MODULES@a} == *a* ]] || read -ra MODULES <<<"$MODULES"
[[ ${HOOKS@a} == *a* ]] || read -ra HOOKS <<<"$HOOKS"
_gu_available=0
modinfo -k "${KERNELVERSION:-$(uname -r)}" -F filename ga107_unlock >/dev/null 2>&1 && _gu_available=1
_gu_modules=()
_gu_inserted=0
for _gu_module in "${MODULES[@]}"; do
    [[ ${_gu_module%\?} == ga107_unlock ]] && continue
    if [[ ${_gu_module%\?} == nvidia && $_gu_available == 1 && $_gu_inserted == 0 ]]; then
        _gu_modules+=(ga107_unlock)
        _gu_inserted=1
    fi
    _gu_modules+=("$_gu_module")
done
if [[ $_gu_available == 1 && $_gu_inserted == 0 ]]; then
    _gu_modules+=(ga107_unlock)
fi
MODULES=("${_gu_modules[@]}")
_gu_hooks=()
for _gu_hook in "${HOOKS[@]}"; do
    [[ $_gu_hook == ga107-order ]] || _gu_hooks+=("$_gu_hook")
done
if [[ $_gu_available == 1 && " ${_gu_hooks[*]} " == *' systemd '* ]]; then
    _gu_hooks+=(ga107-order)
fi
HOOKS=("${_gu_hooks[@]}")
unset _gu_modules _gu_module _gu_hooks _gu_hook _gu_available _gu_inserted
